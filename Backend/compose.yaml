services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: haf
      POSTGRES_USER: haf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haf-local-only}
    ports:
      - "5432:5432"
    volumes:
      - haf_postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_reports.sql:/docker-entrypoint-initdb.d/001_create_reports.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haf -d haf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  haf_postgres_data:
